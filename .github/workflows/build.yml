# 每次 push／pull request：在 Windows 上執行全部測試。
# 推送 v* 標籤（例如 v0.4.0）：另外打包 EXE、執行自我檢查，並建立 GitHub Release 上傳 zip 與 SHA-256。
name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python tools/run_tests.py -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Check version matches tag
        shell: pwsh
        run: |
          $version = python -c "import oes; print(oes.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "oes.__version__ ($version) does not match tag ${{ github.ref_name }}" }
      - name: Create icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py build/app.ico
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name OpenExamSimulator --icon build/app.ico `
            --paths . --add-data "samples;samples" `
            --exclude-module tkinter --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtPdf `
            launcher.py
      - name: Self-test the EXE
        shell: pwsh
        run: |
          $result = Join-Path $PWD "dist/selftest.txt"
          $process = Start-Process -FilePath "dist/OpenExamSimulator/OpenExamSimulator.exe" `
            -ArgumentList "--self-test", "`"$result`"" -Wait -PassThru
          Get-Content $result -Encoding UTF8
          if ($process.ExitCode -ne 0) { throw "Self-test failed" }
      - name: Package zip and checksum
        shell: pwsh
        run: |
          Copy-Item README.md, THIRD_PARTY_NOTICES.md, CHANGELOG.md dist/OpenExamSimulator/
          Copy-Item LICENSE dist/OpenExamSimulator/LICENSE.txt
          Compress-Archive -Path dist/OpenExamSimulator -DestinationPath dist/OpenExamSimulator-win64.zip -Force
          $hash = (Get-FileHash dist/OpenExamSimulator-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  OpenExamSimulator-win64.zip" | Out-File -Encoding ascii dist/OpenExamSimulator-win64.zip.sha256
          Get-Content dist/OpenExamSimulator-win64.zip.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenExamSimulator-win64.zip
            dist/OpenExamSimulator-win64.zip.sha256
          generate_release_notes: true
